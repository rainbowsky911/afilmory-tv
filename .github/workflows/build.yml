name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 确认 ubuntu 自带的 SDK 组件（调试用，失败时能看到有哪些版本）
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "no build-tools"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "no platforms"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: afilmory-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
