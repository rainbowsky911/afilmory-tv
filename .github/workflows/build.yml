name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # AGP 8.2.0 需要 Gradle 8.2-8.7，固定 8.7 避免装到不兼容的新版
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 确保 build-tools 34 + platform 34（sdkmanager 用完整路径，不在 PATH）
      - name: Ensure SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || true
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: afilmory-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
